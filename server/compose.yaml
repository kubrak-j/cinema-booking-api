name: cinema-app

services:
  db:
    image: postgres:17-alpine
    container_name: cinema-db
    restart: always
    env_file: .env.prod
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB" ]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - pgdata:/var/lib/postgresql/data

  migrate:
    build:
      context: .
      target: migrator
      provenance: false
      sbom: false
    image: cinema-migrate-image:latest
    container_name: cinema-migrate
    env_file:
      - .env.prod
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  server:
    build:
      context: .
      target: runner
      provenance: false
      sbom: false
    image: cinema-server-image:latest
    container_name: cinema-server
    env_file:
      - .env.prod
    ports:
      - "7000:7000"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
